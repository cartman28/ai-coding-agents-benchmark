name: Gemini model connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check configuration
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::GEMINI_API_KEY is missing"; exit 1; }
          test -n "$LLM_MODEL" || { echo "::error::LLM_MODEL variable is missing"; exit 1; }
          echo "Model configured: $LLM_MODEL"
      - name: Install LiteLLM (same backend as OpenHands SDK)
        run: python -m pip install 'litellm==1.77.4'
      - name: Send one minimal request
        run: |
          python - <<'PY'
          import os
          import sys
          import litellm

          model = os.environ["LLM_MODEL"]
          try:
              response = litellm.completion(
                  model=model,
                  messages=[{"role": "user", "content": "Reply with exactly: OK"}],
                  max_tokens=16,
                  temperature=0,
                  timeout=35,
                  num_retries=0,
              )
              answer = (response.choices[0].message.content or "").strip()
              print("Model:", model)
              print("Response:", answer[:100])
              print("Connectivity:", "OK" if answer else "EMPTY_RESPONSE")
              if not answer:
                  sys.exit(1)
          except Exception as exc:
              print("Connectivity: FAILED")
              print("Error type:", type(exc).__name__)
              # Do not print exception bodies: provider messages may include sensitive request data.
              sys.exit(1)
          PY
