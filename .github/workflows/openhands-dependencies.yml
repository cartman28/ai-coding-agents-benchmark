name: OpenHands dependency diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install clean pinned SDK and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'openhands-sdk==1.50.1' 'openhands-tools==1.50.1'
          python -m pip install 'litellm==1.105.1' 'mcp==1.30.0' 'fastmcp==3.4.11'
      - name: Print resolved versions and package constraints
        run: |
          python - <<'PY'
          from importlib.metadata import version, requires
          for package in ("openhands-sdk", "openhands-tools", "litellm", "mcp", "fastmcp"):
              print(f"{package}=={version(package)}")
          for package in ("openhands-sdk", "litellm", "fastmcp"):
              print(f"--- {package} relevant requirements ---")
              for item in requires(package) or []:
                  if any(x in item.lower() for x in ("mcp", "litellm", "fastmcp")):
                      print(item)
          PY
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check LiteLLM and MCP runtime imports
        run: |
          python - <<'PY'
          import litellm
          import mcp
          from mcp import ClientSession, McpError
          print("LiteLLM and MCP 1.x imports OK")
          PY
      - name: Check OpenHands imports
        if: always()
        run: |
          python - <<'PY'
          from openhands.sdk import Agent, Conversation, LLM
          from openhands.tools.preset.default import get_default_tools
          tools = get_default_tools(enable_browser=False)
          print("OpenHands imports and tools OK:", [tool.name for tool in tools])
          PY
