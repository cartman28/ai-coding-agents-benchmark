name: Blind Defect Review gemini-cli - Task 4

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blind-review-gemini-cli-task4
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GEMINI_CLI_TRUST_WORKSPACE: "true"
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      BRANCH: benchmark/blind-review-injected-task4
      BASELINE: ffab070b251783d402da304238adea2b588a2bdb
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare read-only review
        run: |
          test -n "$LLM_MODEL"
          git fetch origin "$BRANCH"
          git checkout --detach "origin/$BRANCH"
          git rev-parse HEAD > /tmp/reviewed-commit.txt
          cat > /tmp/revision-prompt.txt <<'EOF'
          You are a read-only independent reviewer. Do not modify repository files or create a PR.
          Review Task 4 (Issue #13) implementation of inventory, fulfillment and journal.
          Inspect the code for concrete correctness and integrity bugs. Do not assume the implementation is correct because prior tests passed.
          For each suspected bug give file, affected function, exact failing scenario and a minimal reproduction. Distinguish verified issues from speculation.
          Write a Markdown review to /tmp/cross-review.md with verdict PASS/CONCERNS/FAIL, findings, strengths and coverage gaps.
          Review only the checked-out code. Do not consult Git history, other branches, PR comments, or benchmark tests.
          EOF
          cat /tmp/reviewed-commit.txt >> /tmp/revision-prompt.txt
      - name: Install Gemini CLI
        run: |
          npm install --global @google/gemini-cli
          gemini --version
      - name: Independent review
        run: |
          MODEL="${LLM_MODEL#gemini/}"
          gemini --model "$MODEL" --yolo --prompt "$(cat /tmp/revision-prompt.txt)" > /tmp/reviewer-output.txt
          if [ ! -s /tmp/cross-review.md ]; then cp /tmp/reviewer-output.txt /tmp/cross-review.md; fi
          test -s /tmp/cross-review.md
      - name: Verify read-only
        run: |
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - name: Upload review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-review-gemini-cli
          path: |
            /tmp/cross-review.md
            /tmp/reviewer-output.txt
            /tmp/reviewed-commit.txt
      - name: Show review
        if: always()
        run: |
          if [ -s /tmp/cross-review.md ]; then cat /tmp/cross-review.md >> "$GITHUB_STEP_SUMMARY"; cat /tmp/cross-review.md; fi
