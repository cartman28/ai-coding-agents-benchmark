name: Benchmark OpenHands SDK

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: benchmark-openhands-issue-1
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      BRANCH: benchmark/openhands-issue-1
      BASELINE: d11a043d3bec83a47b2c0809e0d9fac85c92fd70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare independent baseline
        run: |
          test -n "$GEMINI_API_KEY" && test -n "$LLM_MODEL"
          cp benchmark/runners/openhands_sdk.py /tmp/benchmark-openhands-runner.py
          gh issue view 1 --json body --jq '.body' > /tmp/benchmark-issue.txt
          cat >> /tmp/benchmark-issue.txt <<'EOF'

          Work only in pricebot/pricing.py and tests/test_pricing.py.
          Fix the existing bug and add regression tests.
          Run: python -m unittest discover -s tests -v
          Do not edit CI, workflows, README, or benchmark evaluation files.
          Do not create a PR yourself; the workflow will handle it.
          EOF
          git checkout "$BASELINE"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Frozen baseline: $BASELINE"
      - name: Install OpenHands SDK
        run: |
          python -m pip install 'openhands-sdk==1.50.1' 'openhands-tools==1.50.1'
          python -m pip install --upgrade 'mcp>=1.19,<2'
          python -c 'from mcp.types import CacheableResult; print("MCP compatibility OK")'
      - name: Run OpenHands on issue 1
        run: python /tmp/benchmark-openhands-runner.py < /tmp/benchmark-issue.txt
      - name: Verify changes and tests
        run: |
          git status --short
          python -m unittest discover -s tests -v
          git add pricebot/pricing.py tests/test_pricing.py
          git diff --cached --quiet && { echo "::error::Agent made no changes"; exit 1; }
          git diff --name-only | grep . && { echo "::error::Agent modified files outside allowed scope"; exit 1; } || true
          git diff --cached --name-only
      - name: Push branch and create PR
        run: |
          git commit -m "Benchmark: OpenHands SDK solves issue 1"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Benchmark OpenHands SDK: fix discount calculation (#1)" \
            --body "Candidate: OpenHands SDK 1.50.1. Frozen baseline: \`$BASELINE\`. Model: \`$LLM_MODEL\`. Closes no issue automatically; review and independent acceptance required. Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
