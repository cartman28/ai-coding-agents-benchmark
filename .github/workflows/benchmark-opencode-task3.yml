name: Benchmark OpenCode - Task 3

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: benchmark-opencode-issue-3
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      BRANCH: benchmark/opencode-issue-3
      BASELINE: 673bbd9e05d5ba3756b0eeeb36f93cd243134d5d
      CI: "true"
      OPENCODE_PERMISSION: '{"*":"allow"}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare independent baseline
        run: |
          test -n "$GOOGLE_GENERATIVE_AI_API_KEY" && test -n "$LLM_MODEL"
          gh issue view 9 --json body --jq '.body' > /tmp/benchmark-issue.txt
          cat >> /tmp/benchmark-issue.txt <<'EOF'

          Work only in pricebot/pricing.py, pricebot/orders.py, pricebot/storage.py, tests/test_pricing.py, tests/test_orders.py, and tests/test_storage.py.
          Implement the complete multi-module contract in Issue #9 and comprehensive tests.
          Run: python -m unittest discover -s tests -v
          Do not edit CI, workflows, README, or benchmark evaluation files.
          Do not create a PR yourself; the workflow will handle it.
          EOF
          git checkout "$BASELINE"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Frozen baseline: $BASELINE"
      - name: Install OpenCode
        run: |
          npm install --global opencode-ai
          opencode --version
      - name: Run OpenCode on issue 9
        run: |
          MODEL="${LLM_MODEL#gemini/}"
          echo "OpenCode model: google/$MODEL"
          opencode run --agent build --model "google/$MODEL" "$(cat /tmp/benchmark-issue.txt)"
      - name: Verify changes and tests
        run: |
          git status --short
          python -m unittest discover -s tests -v
          git add pricebot/pricing.py pricebot/orders.py pricebot/storage.py tests/test_pricing.py tests/test_orders.py tests/test_storage.py
          git diff --cached --quiet && { echo "::error::Agent made no changes"; exit 1; }
          if [ -n "$(git diff --name-only)" ] || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Agent modified files outside allowed scope"
            exit 1
          fi
          git diff --cached --name-only
      - name: Push branch and create PR
        run: |
          git commit -m "Benchmark: OpenCode solves issue 9"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Benchmark OpenCode: implement checkout lifecycle (#9)" \
            --body "Candidate: opencode. Frozen baseline: $BASELINE. Model: $LLM_MODEL. Independent task #5; review required. Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
